[build]
  publish = "public"
  functions = "netlify/functions"

[dev]
  command = "echo 'No build step needed'"
  port = 8888

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions.rapport]
  timeout = 26

[functions.send-rapport]
  timeout = 26

[functions.propose]
  included_files = ["netlify/functions/assets/*.pdf"]
  timeout = 26

[functions.planning-export]
  timeout = 26

[functions.confirm-afspraak]
  timeout = 15

[functions.annuleer]
  timeout = 26

[functions.planning-sinds]
  timeout = 26

[functions.mail-check]
  timeout = 26

[functions.rapport-ontvangen]
  timeout = 26

[functions.rapport-vangnet]
  schedule = "*/5 * * * *"
  timeout = 30
