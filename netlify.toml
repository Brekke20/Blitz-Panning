[build]
  publish = "public"
  functions = "netlify/functions"

[dev]
  command = "echo 'No build step needed'"
  port = 8888

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions.rapport]
  timeout = 26

[functions.send-rapport]
  timeout = 26

[functions.propose]
  included_files = ["netlify/functions/assets/*.pdf"]
  timeout = 26

[functions.planning-export]
  timeout = 26

[functions.confirm-afspraak]
  timeout = 15

[functions.annuleer]
  timeout = 26

[functions.bevestig-handmatig]
  timeout = 26

[functions.planning-sinds]
  timeout = 26

[functions.mail-check]
  timeout = 26

[functions.rapport-ontvangen]
  timeout = 26

[functions.sales]
  timeout = 26

[functions.postcode]
  timeout = 26

[functions.sales-import]
  timeout = 26

[functions.rapport-vangnet]
  schedule = "*/5 * * * *"
  timeout = 30

[functions.dashboard]
  timeout = 26

[functions.tickets]
  timeout = 20

# Dagelijkse herinnering 3 dagen voor de interventie (schema staat in de functie zelf): ticketlading (4 tot 6 s) en per ticket een paar Zoho-aanroepen;
# de functie begint na 18 s geen nieuw ticket meer (lib/herinnering.js, tijdBudgetMs).
[functions.herinnering-bevestiging]
  timeout = 30

# Geplande voorlading van de tickets (draait elke 2 minuten, schema staat in de functie zelf): een lading duurt 4 tot 6 s.
[functions.tickets-vooraf]
  timeout = 26

# MCP-leesconnector (Claude): leest rapportlijst + jaararchieven, momentopname, register en afspraken uit Blobs (geen Zoho).
[functions.mcp]
  timeout = 26
