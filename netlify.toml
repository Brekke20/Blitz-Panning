[build]
  publish = "public"
  functions = "netlify/functions"

[dev]
  command = "echo 'No build step needed'"
  port = 8888

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions.rapport]
  timeout = 26

[functions.send-rapport]
  timeout = 26

[functions.propose]
  included_files = ["netlify/functions/assets/*.pdf"]
  timeout = 26

[functions.planning-export]
  timeout = 26
